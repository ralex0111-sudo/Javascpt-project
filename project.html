<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>
    <link rel="stylesheet" href="./project.css">
</head>

<body>

    <header>
        <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>

        <div class="datetime">
            <span id="today"></span>
            <span id="currentTime"></span>
        </div>
    </header>


    <main>
        <section class="search-section">

            <input type="text" id="searchInput" placeholder="Search employee...">
<button id="searchBtn"> Search </button>

        </section>
        <section class="filter-section">

            <button class="department-btn active" data-department="All">
                All
            </button>

            <button class="department-btn" data-department="IT">
                IT
            </button>

            <button class="department-btn" data-department="HR">
                HR
            </button>

            <button class="department-btn" data-department="Finance">
                Finance
            </button>

            <button class="department-btn" data-department="Marketing">
                Marketing
            </button>

        </section>
        <section id="statusMessage">
            Loading employees...
        </section>
        <section class="dashboard">

            <div class="stat-box">
                <h3>Total Employees</h3>
                <p id="employeeCount">0</p>
            </div>

            <div class="stat-box">
                <h3>Total Salary</h3>
                <p id="totalSalary">₹0</p>
            </div>

            <div class="stat-box">
                <h3>Average Salary</h3>
                <p id="averageSalary">₹0</p>
            </div>

            <div class="stat-box">
                <h3>Highest Paid</h3>
                <p id="highestPaid">None</p>
            </div>

        </section>
        <section class="sort-section">

            <label for="sortSelect">
                Sort Employees:
            </label>

            <select id="sortSelect">

                <option value="none">
                    Select
                </option>

                <option value="nameAsc">
                    Name ↑
                </option>

                <option value="nameDesc">
                    Name ↓
                </option>

                <option value="ageAsc">
                    Age ↑
                </option>

                <option value="ageDesc">
                    Age ↓
                </option>

                <option value="salaryAsc">
                    Salary ↑
                </option>

                <option value="salaryDesc">
                    Salary ↓
                </option>

            </select>

        </section>
        <section>

            <div id="employeeContainer" class="employee-container">
            </div>

        </section>
        <section class="add-section">

            <h2>ADD EMPLOYEE</h2>

            <form id="employeeForm">

                <div class="form-group">

                    <label>Name</label>

                    <input type="text"
                        id="name"
                        placeholder="Enter name">

                    <small id="nameError"></small>

                </div>


                <div class="form-group">

                    <label>Age</label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Enter age"
                    >

                    <small id="ageError"></small>

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                    >

                    <small id="emailError"></small>

                </div>


                <div class="form-group">

                    <label>Department</label>

                    <select id="department">

                        <option value="">
                            Select Department
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="HR">
                            HR
                        </option>

                        <option value="Finance">
                            Finance
                        </option>

                        <option value="Marketing">
                            Marketing
                        </option>

                    </select>

                    <small id="departmentError"></small>

                </div>


                <button type="submit" class="add-btn">
                    Add Employee
                </button>

            </form>

        </section>

    </main>
    <script src="./project.js"></script>

</body>
</html>
